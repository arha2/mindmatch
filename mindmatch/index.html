<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f5ef" />
    <meta
      name="description"
      content="Guess your friends’ first thoughts. A private room game for 2–8 players and a moderator."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Mindmatch</title>
  </head>
  <body>
    <header>
      <a href="/" class="wordmark" aria-label="Mindmatch home"
        >mindmatch<span class="brand-dot">.</span></a
      >
      <div id="header-actions"></div>
    </header>
    <div id="network" role="status" hidden></div>
    <main id="app"></main>
    <div id="toast" role="status" hidden></div>
    <dialog id="modal"></dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
